name: Chore or tech debt
description: Maintenance with no user-visible change (deps, CI, renames), or a known shortcut to pay down
type: Task
labels: [chore]
body:
  - type: textarea
    id: what
    attributes:
      label: What and why
      description: For tech debt, what it costs today.
    validations:
      required: true
  - type: input
    id: done
    attributes:
      label: Done when
    validations:
      required: true
  - type: checkboxes
    id: debt
    attributes:
      label: Tech debt
      options:
        - label: This pays down a known shortcut (tech debt)
